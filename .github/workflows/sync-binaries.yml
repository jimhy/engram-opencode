name: sync-binaries

# 从 jimhy/engram 的 Release 拉取四平台引擎二进制，提交进 opencode-plugin/bin/。
# 引擎源码只在 jimhy/engram 一份（可移植内核，跨 CLI 零改动共享）——本仓库
# 零编译、零源码，只复用上游 CI 的交叉编译产物。
#
# 触发：
#   - repository_dispatch(engram-release)：jimhy/engram 发版后由其 release.yml
#     自动通知（client_payload.version = 上游 tag，如 v0.1.10）。
#   - workflow_dispatch：在 Actions 页手动跑，可传 version（默认 latest）。
#
# 注意：opencode 适配器以 npm 包形式分发。本 workflow 只把刷新后的二进制提交进
# 仓库；要让用户装到新引擎，仍需手动 `npm publish`（包名/时机由维护者定，不在此自动化）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "engram release tag to pull (e.g. v0.1.10) or 'latest'"
        default: latest
  repository_dispatch:
    types: [engram-release]

permissions:
  contents: write

jobs:
  sync:
    name: sync engine binaries from jimhy/engram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            v="${{ github.event.client_payload.version }}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"

      # ⚠ pattern 必须逐个平台列出，不能图省事写 'engram-*'：
      #   上游 Release 里还有 engram-kb-* 三个 sidecar 二进制（合计约 500MB），
      #   它们同样匹配 'engram-*'，会被一并拉进本仓库的 bin/ 并提交。
      #   此前没出事只是**时序巧合**——历次 sync 都跑在 kb 编译完成之前，
      #   Release 上当时还没有那几个 asset。任何时候手动重跑都可能中招。
      - name: Download binaries from jimhy/engram release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p opencode-plugin/bin
          if [ "$v" = "latest" ] || [ -z "$v" ]; then
            gh release download --repo jimhy/engram --pattern 'engram-linux-*' --pattern 'engram-macos-*' --pattern 'engram-windows-*' --dir opencode-plugin/bin --clobber
          else
            gh release download "$v" --repo jimhy/engram --pattern 'engram-linux-*' --pattern 'engram-macos-*' --pattern 'engram-windows-*' --dir opencode-plugin/bin --clobber
          fi
          chmod +x opencode-plugin/bin/engram-linux-* opencode-plugin/bin/engram-macos-* 2>/dev/null || true
          ls -la opencode-plugin/bin

      - name: Commit refreshed binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode-plugin/bin
          if git diff --cached --quiet; then
            echo "no binary changes (already in sync)"
          else
            git commit -m "ci: sync engram ${{ steps.ver.outputs.version }} binaries"
            git push
          fi
